http:
  middlewares:
    global-security-headers:
      headers:
        sslRedirect: true
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""

    global-compress:
      compress:
        excludedContentTypes:
          - text/event-stream

    rate-limit-api:
      rateLimit:
        average: 100
        burst: 50
        period: 1s

    rate-limit-strict:
      rateLimit:
        average: 10
        burst: 5
        period: 1s
